<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="container">
    <nav>
      <div class="logo"><img width="80px" src="logo.png" alt=""></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products...">
      </div>
      <button class="cart-button" id="cartButton">Cart (<span id="cartCount">0</span>)</button>
    </nav>
  </header>

  <main class="container">
    <section id="shopSection">
      <h1>Find your favourites</h1>
      <p class="intro">Simple products for your everyday needs.</p>

      <div class="filters">
        <select id="categoryFilter">
          <option value="all">All categories</option>
        </select>
        <select id="sortFilter">
          <option value="default">Sort by: Default</option>
          <option value="low">Price: Low to high</option>
          <option value="high">Price: High to low</option>
          <option value="rating">Top rated</option>
        </select>
      </div>

      <div class="products" id="productList"></div>
    </section>

    <section id="cartSection" class="cart-section hidden">
      <button class="back-button" id="backButton">← Continue shopping</button>
      <h1>Your shopping cart</h1>
      <p class="intro">Check your items and order total.</p>

      <div class="cart-layout">
        <div class="cart-items" id="cartItems"></div>
        <div class="summary">
          <h2>Order summary</h2>
          <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
          <div class="summary-row"><span>Product discount</span><span id="discount">₹0</span></div>
          <div class="summary-row"><span>Coupon discount</span><span id="couponDiscount">₹0</span></div>
          <div class="summary-row"><span>Delivery</span><span id="delivery">₹0</span></div>
          <div class="summary-row total"><span>Total</span><span id="total">₹0</span></div>
          <div class="coupon">
            <input type="text" id="couponInput" placeholder="Coupon code">
            <button id="applyCoupon">Apply</button>
          </div>
          <p class="message" id="couponMessage">Use SAVE10 for 10% extra off on orders above ₹1,000.</p>
          <button class="checkout-button" id="checkoutButton">Checkout</button>
        </div>
      </div>
    </section>
  </main>

  <footer>ShopEase · CE-1 Mini Project</footer>
  <script src="script.js"></script>
</body>
</html>
